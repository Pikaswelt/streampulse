[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse-ai"
version = "1.0.0"
description = "Real-Time YouTube Live & Premiere to X (Twitter) AI Agent with Zero-Waste Transcription & Screenshot Snapping"
readme = "README.md"
authors = [{ name = "Pikaswelt" }]
license = { text = "MIT" }
keywords = ["youtube", "livestream", "twitter", "x", "ai", "whisper", "gemini", "social-media", "live-blogging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0.0",
    "tweepy>=4.14.0",
    "youtube-transcript-api>=0.6.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
streampulse = "streampulse.cli:main"
